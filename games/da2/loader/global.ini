; Ultimate ASI Loader settings for Dragon Age II (bin_ship\scripts\global.ini).
; The Steam / EA exe is wrapped by EA DRM, which loads dinput8.dll only after the
; game has started, too late for the loader's usual start; so plugins load from
; its DllMain. See games\da2\NOTEBOOK.md.
[GlobalSets]
LoadPlugins=1
LoadFromScriptsOnly=1
DontLoadFromDllMain=0
